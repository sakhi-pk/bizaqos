<script type="text/babel" data-presets="react">
/* ============================================================
   Client Acquisition OS and Quote Generator  (single-file React)
   All data below is MOCK demo data generated in the browser.
   Component name: ClientAcquisitionOS (rendered at the bottom).
   ============================================================ */
const { useState, useMemo, useEffect } = React;

/* ---------- helpers ---------- */
const NOW = new Date();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = (d) => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const parse = (s) => new Date(s + 'T00:00:00');
const fmtDate = (s) => parse(s).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
const usd0 = (n) => (n < 0 ? '-$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US');
const usd2 = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const TODAY = iso(NOW);

/* ---------- static config ---------- */

  Silver:   { rate: 0.01, next: 'Gold',     threshold: 750000 },

const TIER_STYLE = {
  Silver: 'bg-slate-500/15 text-slate-300 ring-slate-400/30',

  Platinum: 'bg-cyan-500/10 text-cyan-300 ring-cyan-400/30',

  { id: 'AVG-DEALER-884',  name: 'Azam Regional Logistics',   tier: 'Gold',     limit: 500000,  used: 312400, scale: 1 },
  { id: 'AVG-DEALER-512',  name: 'Indus Valley Distributors', tier: 'Silver',   limit: 250000,  used: 96500,  scale: 0.6 },
  { id: 'AVG-DEALER-1207', name: 'Gulf Crescent Trading',     tier: 'Platinum', limit: 1000000, used: 742000, scale: 1.6 },

const SKUS = [
  { sku: 'BRG-2210', name: 'Sealed Ball Bearing 6205',        cat: 'Bearings',           price: 12.40,  stock: 4200 },
  { sku: 'HYD-3301', name: 'Hydraulic Hose 1/2" x 10 m',      cat: 'Hydraulics',         price: 86.00,  stock: 640 },
  { sku: 'FLT-1180', name: 'Industrial Oil Filter HD',        cat: 'Filtration',         price: 24.75,  stock: 1850 },
  { sku: 'PMP-7742', name: 'Centrifugal Pump 2 HP',           cat: 'Pumps',              price: 412.00, stock: 96 },
  { sku: 'CBL-5050', name: 'Armoured Cable 4 mm2 (100 m)',    cat: 'Electrical',         price: 138.50, stock: 380 },
  { sku: 'VLV-6120', name: 'Ball Valve Stainless 2"',         cat: 'Valves',             price: 64.20,  stock: 720 },
  { sku: 'GSK-9004', name: 'Gasket Kit Universal',            cat: 'Seals',              price: 18.90,  stock: 2400 },
  { sku: 'MTR-8821', name: 'Induction Motor 5 HP',            cat: 'Motors',             price: 689.00, stock: 54 },
  { sku: 'BLT-4410', name: 'V-Belt Set B-Series',             cat: 'Power Transmission', price: 31.60,  stock: 1300 },
  { sku: 'LUB-2005', name: 'Synthetic Gear Oil 20 L',         cat: 'Lubricants',         price: 142.00, stock: 210 },
];
const SKU_MAP = Object.fromEntries(SKUS.map((s) => [s.sku, s]));
const CATS = ['All', ...Array.from(new Set(SKUS.map((s) => s.cat)))];
const MONTHLY_BASE = [78400, 84200, 91000, 88500, 97300, 101200, 95800, 104600, 108900, 112160, 125090, 142850];
const CAT_BASE = [['Motors', 268000], ['Pumps', 231000], ['Hydraulics', 176000], ['Lubricants', 141000], ['Electrical', 122000],
  ['Bearings', 96000], ['Valves', 79000], ['Filtration', 52000], ['Power Transmission', 38000], ['Seals', 27000]];
const STATUSES = ['Processing', 'Shipped', 'Customs Clearance', 'Delivered'];
const STATUS_STYLE = {
  Processing: 'bg-blue-500/10 text-blue-300 ring-blue-400/30',
  Shipped: 'bg-indigo-500/10 text-indigo-300 ring-indigo-400/30',
  'Customs Clearance': 'bg-amber-500/10 text-amber-300 ring-amber-400/30',
  Delivered: 'bg-emerald-500/10 text-emerald-300 ring-emerald-400/30',
};
const PAY_STYLE = {
  Paid: 'bg-emerald-500/10 text-emerald-300 ring-emerald-400/30',
  Pending: 'bg-amber-500/10 text-amber-300 ring-amber-400/30',
  Overdue: 'bg-red-500/10 text-red-300 ring-red-400/30',
};
const MILESTONES = [
  { name: 'Order confirmed', off: 0 }, { name: 'Processing and packing', off: 0 },
  { name: 'Shipped', off: 3 }, { name: 'Customs clearance', off: 8 }, { name: 'Delivered', off: 12 },
];

/* ---------- pricing ---------- */
const tierFor = (q) => (q >= 200 ? { label: '200+ units', disc: 0.15 } : q >= 50 ? { label: '50 to 199 units', disc: 0.08 } : { label: '1 to 49 units', disc: 0 });
const lineCalc = (sku, q) => {
  const t = tierFor(q); const unit = sku.price * (1 - t.disc);
  return { unit, list: sku.price * q, total: unit * q, saving: sku.price * q - unit * q, tier: t };
};
const cartTotals = (cart) => {
  let list = 0, total = 0, units = 0, lines = 0;
  Object.entries(cart).forEach(([k, q]) => { if (q > 0 && SKU_MAP[k]) { const c = lineCalc(SKU_MAP[k], q); list += c.list; total += c.total; units += q; lines += 1; } });
  return { list, total, units, lines, saving: list - total };
};

/* ---------- mock data builders ---------- */
const buildOrders = (scale) => {
  const totals = [18400, 42650, 9800, 27300, 63100, 15750, 38200, 11900, 52400, 7600, 29900, 44800, 21350, 33700, 16200, 58900, 12450, 24600, 36100, 8900, 47250, 19800, 31500, 26400];
  const counts = [3, 5, 2, 4, 6, 3, 5, 2, 7, 1, 4, 5, 3, 6, 2, 8, 3, 4, 5, 2, 6, 3, 4, 4];
  const delDays = [64, 60, 55, 49, 44, 38];
  const base = { Processing: 2, Shipped: 9, 'Customs Clearance': 17 };
  let list = [];
  for (let i = 0; i < 24; i++) {
    let status, days;
    if (i < 6) { status = 'Delivered'; days = delDays[i]; }
    else { const a = i - 6; status = ['Processing', 'Shipped', 'Customs Clearance'][a % 3]; days = base[status] + (a % 4) * 2; }
    list.push({ status, days, total: Math.round((totals[i] * scale) / 50) * 50, skus: counts[i], action: null });
  }
  list.sort((a, b) => b.days - a.days);
  const active = list.filter((o) => o.status !== 'Delivered');
  active[1].action = 'Customs documents required';
  active[6].action = 'Delivery address confirmation needed';
  active[13].action = 'Payment verification pending';
  list = list.map((o, i) => ({ id: 'PO-26-' + (1040 + i), date: iso(addDays(NOW, -o.days)), skus: o.skus, status: o.status, total: o.total, action: o.action }));
  return list.reverse();
};
const buildLedger = (scale) => {
  const amt = (v) => Math.round((v * scale) / 50) * 50;
  const methods = ['ACH', 'Corporate Gateway', 'Credit Terms'];
  const paidAmts = [32100, 18450, 27800, 41200, 9650, 22300, 35900, 14700, 28600, 19250, 38400, 12800, 24500, 30150];
  const paidDays = [4, 9, 15, 22, 28, 36, 43, 51, 58, 66, 73, 80, 87, 94];
  const rows = [];
  paidAmts.forEach((a, i) => {
    const m = methods[i % 3]; const issued = addDays(NOW, -paidDays[i]);
    rows.push({ date: iso(issued), due: iso(addDays(issued, m === 'Credit Terms' ? 30 : 0)), amount: amt(a), method: m, status: 'Paid', desc: m === 'Credit Terms' ? 'Net-30 invoice settled' : 'Order settlement' });
  });
  [[21500, 8], [16200, 17], [10500, 26]].forEach(([a, due]) => {
    const dueD = addDays(NOW, due);
    rows.push({ date: iso(addDays(dueD, -30)), due: iso(dueD), amount: amt(a), method: 'Credit Terms', status: 'Pending', desc: 'Net-30 invoice' });
  });
  [[12300, -5], [4750, -12]].forEach(([a, due]) => {
    const dueD = addDays(NOW, due);
    rows.push({ date: iso(addDays(dueD, -30)), due: iso(dueD), amount: amt(a), method: 'Credit Terms', status: 'Overdue', desc: 'Net-30 invoice' });
  });
  rows.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return rows.map((r, i) => ({ id: 'INV-26' + String(i + 1).padStart(3, '0'), ...r })).reverse();
};
const buildDealer = (cfg) => {
  const monthly = MONTHLY_BASE.map((v) => Math.round((v * cfg.scale) / 10) * 10);
  return {
    profile: { id: cfg.id, name: cfg.name, tier: cfg.tier },
    limit: cfg.limit, used: cfg.used, monthly,
    ytd: monthly.reduce((a, b) => a + b, 0),
    cats: CAT_BASE.map(([n, v]) => [n, Math.round((v * cfg.scale) / 1000) * 1000]),
    orders: buildOrders(cfg.scale), ledger: buildLedger(cfg.scale),
    approvals: [
      { id: 'APR-1001', created: iso(addDays(NOW, -1)), note: 'Plant expansion', lines: [{ sku: 'MTR-8821', qty: 40 }, { sku: 'PMP-7742', qty: 25 }] },
      { id: 'APR-1002', created: iso(addDays(NOW, -2)), note: 'Service stock replenishment', lines: [{ sku: 'FLT-1180', qty: 300 }, { sku: 'GSK-9004', qty: 150 }, { sku: 'BLT-4410', qty: 60 }] },
    ],
    seq: 1002, cart: {}, draft: null, extension: null,
  };
};
const buildStore = () => {
  const s = {}; DEALER_CFG.forEach((c) => { s[c.id] = buildDealer(c); });
  try { const raw = localStorage.getItem('avg-os-drafts'); if (raw) { const dr = JSON.parse(raw); Object.keys(s).forEach((k) => { if (dr && dr[k] && dr[k].cart) s[k].draft = dr[k]; }); } } catch (e) {}
  return s;
};
const monthLabels = () => Array.from({ length: 12 }, (_, i) => new Date(NOW.getFullYear(), NOW.getMonth() - (12 - i), 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' }));
const approvalTotal = (a) => a.lines.reduce((s, l) => s + lineCalc(SKU_MAP[l.sku], l.qty).total, 0);

/* ---------- icons (lucide-style inline SVG) ---------- */
const ICONS = {
  search: <><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></>,
  plus: <><path d="M5 12h14" /><path d="M12 5v14" /></>,
  check: <path d="M20 6 9 17l-5-5" />,
  x: <><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>,
  down: <path d="m6 9 6 6 6-6" />,
  right: <path d="m9 18 6-6-6-6" />,
  download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></>,
  truck: <><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" /><path d="M15 18H9" /><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" /><circle cx="17" cy="18" r="2" /><circle cx="7" cy="18" r="2" /></>,
  box: <><path d="m7.5 4.27 9 5.15" /><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" /></>,
  file: <><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M16 13H8" /><path d="M16 17H8" /></>,
  chart: <><line x1="12" x2="12" y1="20" y2="10" /><line x1="18" x2="18" y1="20" y2="4" /><line x1="6" x2="6" y1="20" y2="16" /></>,
  trend: <><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></>,
  alert: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></>,
  clock: <><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>,
  building: <><rect width="16" height="20" x="4" y="2" rx="2" /><path d="M9 22v-4h6v4" /><path d="M8 6h.01" /><path d="M12 6h.01" /><path d="M16 6h.01" /><path d="M8 10h.01" /><path d="M12 10h.01" /><path d="M16 10h.01" /><path d="M8 14h.01" /><path d="M12 14h.01" /><path d="M16 14h.01" /></>,
  card: <><rect width="20" height="14" x="2" y="5" rx="2" /><line x1="2" x2="22" y1="10" y2="10" /></>,
  award: <><circle cx="12" cy="8" r="6" /><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" /></>,
  save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></>,
  send: <><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></>,
  printer: <><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect width="12" height="8" x="6" y="14" /></>,
  grid: <><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></>,
};
const Icon = ({ name, className = 'h-4 w-4' }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">{ICONS[name]}</svg>
);

/* ---------- small UI parts ---------- */
const Pill = ({ cls, children }) => (
  <span className={'inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset ' + cls}>{children}</span>
);
const Card = ({ className = '', children }) => (
  <div className={'rounded-xl border border-slate-800 bg-slate-900 ' + className}>{children}</div>
);
const Btn = ({ kind = 'ghost', className = '', ...p }) => {
  const k = {
    primary: 'bg-blue-600 text-white hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-400',
    ghost: 'border border-slate-700 bg-slate-800/50 text-slate-200 hover:bg-slate-800 disabled:text-slate-500',
    success: 'bg-emerald-600 text-white hover:bg-emerald-500 disabled:bg-slate-700',
    danger: 'border border-red-500/40 text-red-300 hover:bg-red-500/10',
  }[kind];
  return <button {...p} className={'inline-flex items-center justify-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition-colors disabled:cursor-not-allowed ' + k + ' ' + className} />;
};
function Modal({ title, onClose, children }) {
  useEffect(() => { const h = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, []);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4" onMouseDown={onClose}>
      <div role="dialog" aria-label={title} className="max-h-[90vh] w-full max-w-2xl overflow-auto rounded-xl border border-slate-700 bg-slate-900 shadow-2xl" onMouseDown={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between border-b border-slate-800 px-5 py-4">
          <h3 className="text-base font-semibold text-white">{title}</h3>
          <button onClick={onClose} className="rounded-md p-1 text-slate-400 hover:bg-slate-800 hover:text-white" aria-label="Close"><Icon name="x" /></button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

/* ---------- micro charts ---------- */
function Sparkline({ data, color = '#34d399', w = 96, h = 34 }) {
  const max = Math.max(...data), min = Math.min(...data), rng = max - min || 1;
  const pts = data.map((v, i) => (i / (data.length - 1)) * w + ',' + (h - 3 - ((v - min) / rng) * (h - 6))).join(' ');
  return <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} className="shrink-0"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" /></svg>;
}
function MiniBars({ data, color = '#60a5fa', w = 96, h = 34 }) {
  const max = Math.max(...data, 1), bw = w / data.length;
  return <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} className="shrink-0">{data.map((v, i) => <rect key={i} x={i * bw + 3} width={bw - 6} y={h - (v / max) * h} height={Math.max((v / max) * h, 2)} rx="2" fill={color} />)}</svg>;
}
function Ring({ pct, color = '#34d399', size = 46 }) {
  const r = 18, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox="0 0 44 44" className="shrink-0">
      <circle cx="22" cy="22" r={r} fill="none" stroke="#1e293b" strokeWidth="5" />
      <circle cx="22" cy="22" r={r} fill="none" stroke={color} strokeWidth="5" strokeDasharray={(c * Math.min(pct, 100)) / 100 + ' ' + c} strokeLinecap="round" transform="rotate(-90 22 22)" />
    </svg>
  );
}
function BarChart({ values, labels }) {
  const [hv, setHv] = useState(null);
  const W = 640, H = 240, pad = { l: 48, r: 8, t: 18, b: 28 };
  const max = Math.max(...values) * 1.12, iw = W - pad.l - pad.r, ih = H - pad.t - pad.b, bw = iw / values.length;
  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} className="h-auto w-full" role="img" aria-label="Monthly procurement spend, last 12 months">
      {[0, 0.25, 0.5, 0.75, 1].map((t) => { const y = pad.t + ih - t * ih; return (
        <g key={t}><line x1={pad.l} x2={W - pad.r} y1={y} y2={y} stroke="#1e293b" /><text x={pad.l - 6} y={y + 3} textAnchor="end" fontSize="10" fill="#64748b">{'$' + Math.round((max * t) / 1000) + 'k'}</text></g>); })}
      {values.map((v, i) => { const h = (v / max) * ih, x = pad.l + i * bw, y = pad.t + ih - h; return (
        <g key={i} onMouseEnter={() => setHv(i)} onMouseLeave={() => setHv(null)}>
          <rect x={x} y={pad.t} width={bw} height={ih} fill="transparent" />
          <rect x={x + bw * 0.16} y={y} width={bw * 0.68} height={h} rx="3" fill={i === values.length - 1 ? '#34d399' : '#3b82f6'} opacity={hv === null || hv === i ? 1 : 0.5} />
          <text x={x + bw / 2} y={H - 10} textAnchor="middle" fontSize="9.5" fill="#64748b">{labels[i]}</text>
          {hv === i && <text x={x + bw / 2} y={y - 6} textAnchor="middle" fontSize="11" fill="#e2e8f0" fontFamily="ui-monospace,monospace">{usd0(v)}</text>}
        </g>); })}
    </svg>
  );
}
function LineChart({ actual, projected }) {
  const W = 640, H = 220, pad = { l: 48, r: 10, t: 14, b: 24 };
  const all = [...actual, ...projected], max = Math.max(...all) * 1.1, min = Math.min(...all) * 0.8;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b, n = all.length;
  const X = (i) => pad.l + (i / (n - 1)) * iw, Y = (v) => pad.t + ih - ((v - min) / (max - min)) * ih;
  const a = actual.map((v, i) => X(i) + ',' + Y(v)).join(' ');
  const p = [actual[actual.length - 1], ...projected].map((v, i) => X(actual.length - 1 + i) + ',' + Y(v)).join(' ');
  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} className="h-auto w-full" role="img" aria-label="Actual and projected monthly volume">
      {[0, 0.5, 1].map((t) => { const v = min + (max - min) * t, y = Y(v); return <g key={t}><line x1={pad.l} x2={W - pad.r} y1={y} y2={y} stroke="#1e293b" /><text x={pad.l - 6} y={y + 3} textAnchor="end" fontSize="10" fill="#64748b">{'$' + Math.round(v / 1000) + 'k'}</text></g>; })}
      <line x1={X(actual.length - 1)} x2={X(actual.length - 1)} y1={pad.t} y2={pad.t + ih} stroke="#475569" strokeDasharray="3 3" />
      <text x={X(actual.length - 1) - 4} y={H - 6} textAnchor="end" fontSize="10" fill="#64748b">Last 12 months</text>
      <text x={X(actual.length - 1) + 4} y={H - 6} fontSize="10" fill="#64748b">Projected 12 months</text>
      <polyline points={a} fill="none" stroke="#3b82f6" strokeWidth="2.5" strokeLinejoin="round" />
      <polyline points={p} fill="none" stroke="#34d399" strokeWidth="2.5" strokeDasharray="6 5" strokeLinejoin="round" />
    </svg>
  );
}

  return (

          <Fig label="Credit utilized" value={usd0(d.used)} cls={st.txt} />

function MatrixView({ d, patch, toast, ui, setUi, openCredit }) {

  const avail = d.limit - d.used;
  const rows = SKUS.filter((s) => (ui.matrixCat === 'All' || s.cat === ui.matrixCat) && (!ui.matrixQuery || (s.sku + ' ' + s.name + ' ' + s.cat).toLowerCase().includes(ui.matrixQuery.toLowerCase())));
  const over = Object.entries(cart).filter(([k, q]) => q > 0 && SKU_MAP[k] && q > SKU_MAP[k].stock);
  const setQty = (sku, v) => { const q = Math.max(0, Math.min(99999, parseInt(v, 10) || 0)); patch((s) => ({ ...s, cart: { ...s.cart, [sku]: q } })); };
  const after = avail - totals.total;

  const saveDraft = () => {
    if (!totals.lines) return toast('Add at least one SKU quantity before saving a draft.', 'warn');
    patch((s) => ({ ...s, draft: { cart: { ...s.cart }, savedAt: new Date().toISOString() } }));
    toast('Draft order saved on this device.');

  const submit = () => {
    if (!totals.lines) return toast('Add at least one SKU quantity first.', 'warn');
    if (over.length) return toast('Reduce quantities above available stock (' + over.map(([k]) => k).join(', ') + ').', 'error');
    if (totals.total > avail) { toast('Order total exceeds available credit by ' + usd0(totals.total - avail) + '. Request an extension.', 'error'); return openCredit(Math.ceil((totals.total - avail) / 10000) * 10000); }
    patch((s) => { const seq = s.seq + 1; return { ...s, seq, cart: {}, approvals: [{ id: 'APR-' + seq, created: TODAY, note: 'Matrix order', lines: Object.entries(s.cart).filter(([, q]) => q > 0).map(([sku, qty]) => ({ sku, qty })) }, ...s.approvals] }; });
    toast('Order submitted for internal approval.');

    });

          <div className="overflow-x-auto">

                <tr><th className="px-4 py-3">SKU</th><th className="px-4 py-3">Product</th><th className="px-4 py-3 text-right">Stock</th><th className="px-4 py-3 text-right">List</th><th className="px-4 py-3 text-center">Qty</th><th className="px-4 py-3">Tier</th><th className="px-4 py-3 text-right">Unit</th><th className="px-4 py-3 text-right">Line total</th></tr>

function downloadInvoice(d, tx) {
  const html = '<!doctype html><html><head><meta charset="utf-8"><title>' + tx.id + '</title><style>body{font-family:Arial,sans-serif;max-width:640px;margin:40px auto;color:#0f172a}h1{font-size:20px}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left}.r{text-align:right}.note{color:#64748b;font-size:12px;margin-top:24px}</style></head><body>' +
    '<h1>Invoice ' + tx.id + '</h1><p><strong>' + d.profile.name + '</strong><br>' + d.profile.id + '</p>' +
    '<table><tr><th>Issued</th><td>' + fmtDate(tx.date) + '</td></tr><tr><th>Due</th><td>' + fmtDate(tx.due) + '</td></tr><tr><th>Description</th><td>' + tx.desc + '</td></tr><tr><th>Payment method</th><td>' + tx.method + '</td></tr><tr><th>Status</th><td>' + tx.status + '</td></tr><tr><th>Amount</th><td class="r"><strong>' + usd2(tx.amount) + '</strong></td></tr></table>' +
    '<p class="note">Demo document generated in your browser from mock data. Not a real invoice.</p></body></html>';
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a'); a.href = url; a.download = tx.id + '.html'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function AnalyticsView({ d }) {
  const [growth, setGrowth] = useState(2);
  const labels = useMemo(monthLabels, []);
  const tier = TIERS[d.profile.tier], g = growth / 100, last = d.monthly[11];
  const sim = useMemo(() => {
    let cum = d.ytd, rebate = 0, stay = 0, monthsTo = null; const proj = [];
    for (let m = 1; m <= 36; m++) {
      const v = last * Math.pow(1 + g, m); cum += v;
      if (tier.next && monthsTo === null && cum >= tier.threshold) monthsTo = m;
      if (m <= 12) { proj.push(v); const up = tier.next && cum >= tier.threshold; rebate += v * (up ? TIERS[tier.next].rate : tier.rate); stay += v * tier.rate; }
    }
    return { proj, rebate, stay, monthsTo, annual: proj.reduce((a, b) => a + b, 0) };
  }, [d, g]);
  const catMax = Math.max(...d.cats.map((c) => c[1])), catTotal = d.cats.reduce((a, c) => a + c[1], 0);
  const pct = tier.next ? Math.min(100, (d.ytd / tier.threshold) * 100) : 100;
  return (
    <div className="space-y-6">
      <div className="grid items-start gap-6 lg:grid-cols-2">
        <Card className="p-5"><h3 className="text-sm font-semibold text-white">Monthly spending</h3><p className="mb-3 text-xs text-slate-400">Last 12 months of procurement volume. Hover a bar for the exact value.</p><BarChart values={d.monthly} labels={labels} /></Card>
        <Card className="p-5"><h3 className="text-sm font-semibold text-white">Top purchased categories</h3><p className="mb-4 text-xs text-slate-400">Share of trailing 12-month spend ({usd0(catTotal)}).</p>
          <ul className="space-y-3">{d.cats.map(([n, v]) => (
            <li key={n}><div className="flex justify-between text-xs"><span className="text-slate-200">{n}</span><span className="font-mono text-slate-400">{usd0(v)} ({((v / catTotal) * 100).toFixed(1)}%)</span></div>
              <div className="mt-1 h-2 overflow-hidden rounded-full bg-slate-800"><div className="h-full rounded-full bg-blue-500" style={{ width: (v / catMax) * 100 + '%' }} /></div></li>))}</ul></Card>
      </div>
      <Card className="p-5">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div><h3 className="text-sm font-semibold text-white">Volume projection and estimated annual rebate</h3>
            <p className="text-xs text-slate-400">Move the slider to model month-over-month growth in procurement volume.</p></div>
          <label className="text-xs text-slate-400">Monthly growth: <span className="font-mono text-sm text-white">{growth > 0 ? '+' : ''}{growth.toFixed(1)}%</span>
            <input type="range" min="-5" max="10" step="0.5" value={growth} onChange={(e) => setGrowth(parseFloat(e.target.value))} className="mt-1 block w-56 accent-emerald-500" aria-label="Monthly growth percentage" /></label>
        </div>
        <div className="mt-4 grid gap-6 lg:grid-cols-[1.4fr_1fr]">
          <LineChart actual={d.monthly} projected={sim.proj} />
          <div className="space-y-3">
            <div className="rounded-lg bg-slate-950/60 p-4"><div className="text-xs uppercase tracking-wide text-slate-400">Projected next 12 months</div><div className="mt-1 font-mono text-xl font-semibold text-white">{usd0(sim.annual)}</div></div>
            <div className="rounded-lg bg-slate-950/60 p-4"><div className="text-xs uppercase tracking-wide text-slate-400">Estimated annual rebate</div><div className="mt-1 font-mono text-xl font-semibold text-emerald-400">{usd0(sim.rebate)}</div>
              {tier.next && sim.rebate > sim.stay && <div className="mt-1 text-xs text-slate-400">{usd0(sim.rebate - sim.stay)} more than staying on {d.profile.tier}</div>}</div>
            <div className="rounded-lg bg-slate-950/60 p-4"><div className="text-xs uppercase tracking-wide text-slate-400">{tier.next ? 'Progress to ' + tier.next : 'Top tier reached'}</div>
              <div className="mt-2 h-2 overflow-hidden rounded-full bg-slate-800"><div className="h-full rounded-full bg-emerald-500" style={{ width: pct + '%' }} /></div>
              <div className="mt-1 text-xs text-slate-400">{tier.next ? pct.toFixed(0) + '% of ' + usd0(tier.threshold) + '. ' + (sim.monthsTo ? 'Reached in about ' + sim.monthsTo + ' month' + (sim.monthsTo > 1 ? 's' : '') + ' at this growth.' : 'Not reached within 36 months at this growth.') : 'Platinum rebate rate applies to all volume.'}</div></div>
          </div>
        </div>
        <p className="mt-4 text-xs text-slate-500">Assumptions (demo): rebate rates Silver 1%, Gold 2%, Platinum 5%; tier thresholds are annual qualifying volume of $750,000 (Gold) and $1,500,000 (Platinum). Replace with your real program terms.</p>
      </Card>
    </div>
  );
}

function ExtensionModal({ d, initial, onClose, onSubmit }) {

        <input type="number" min="10000" step="10000" value={amount} onChange={(e) => setAmount(parseInt(e.target.value, 10) || 0)} className="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 font-mono text-sm text-slate-100 focus:border-blue-500 focus:outline-none" /></label>
      <label className="mt-4 block text-xs text-slate-400">Business reason

}

        <p className="text-sm">{d.profile.name} - {d.profile.id} - generated {fmtDate(TODAY)}</p>
        <p className="text-sm">Credit line {usd0(d.limit)} - utilized {usd0(d.used)} - available {usd0(d.limit - d.used)}</p>
        <table className="mt-4 w-full border-collapse text-xs"><thead><tr className="border-b-2 border-slate-400 text-left"><th className="py-1">Invoice</th><th>Issued</th><th>Due</th><th>Method</th><th>Status</th><th className="text-right">Amount</th></tr></thead>
          <tbody>{d.ledger.map((t) => <tr key={t.id} className="border-b border-slate-300"><td className="py-1">{t.id}</td><td>{fmtDate(t.date)}</td><td>{fmtDate(t.due)}</td><td>{t.method}</td><td>{t.status}</td><td className="text-right">{usd2(t.amount)}</td></tr>)}</tbody></table>
        <p className="mt-6 text-xs text-slate-500">Demo statement generated from mock data. Not a financial record.</p>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ClientAcquisitionOS />);
</script>
</body>
</html>
